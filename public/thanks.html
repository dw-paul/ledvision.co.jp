<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="お問い合わせを受け付けました。" />
  <meta name="robots" content="noindex,nofollow" />
  <title>送信完了 | LED Vision</title>

  <style>
    :root {
      --bg: #0B0E14;
      --fg: #F3F6FF;
      --muted: rgba(243, 246, 255, .72);
      --line: rgba(255, 255, 255, .12);
      --card: rgba(0, 0, 0, .35);
      --radius: 18px;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--fg);
      background: var(--bg);
    }

    .hero {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .hero video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      filter: saturate(1.05) contrast(1.05);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, .60), rgba(0, 0, 0, .60)),
        radial-gradient(900px 520px at 50% 35%, rgba(0, 0, 0, .22), rgba(0, 0, 0, .74));
    }

    .content {
      position: relative;
      width: min(860px, 92vw);
      z-index: 1;
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      backdrop-filter: blur(10px);
      padding: 18px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand b {
      font-size: 15px;
      letter-spacing: .08em;
    }

    .brand span {
      font-size: 12px;
      color: var(--muted);
    }

    h1 {
      margin: 10px 0 0;
      font-size: 34px;
      line-height: 1.12;
      letter-spacing: .02em;
    }

    p {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.8;
      font-size: 14px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      align-items: center;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .06);
      color: var(--fg);
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, .09);
      border-color: rgba(255, 255, 255, .18)
    }

    .btnPrimary {
      background: rgba(255, 255, 255, .14);
      border-color: rgba(255, 255, 255, .22);
    }

    .mini {
      font-size: 12px;
      color: var(--muted);
    }

    .check {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, .16);
      background: rgba(255, 255, 255, .06);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 18px;
    }

    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      color: rgba(255, 255, 255, .6);
      font-size: 12px;
      z-index: 2;
      pointer-events: none;
    }

    footer span {
      pointer-events: auto
    }

    @media (prefers-reduced-motion: reduce) {
      .hero video {
        display: none
      }

      .hero {
        background: linear-gradient(180deg, #101522, #0B0E14)
      }
    }
  </style>
</head>

<body>
  <section class="hero">
    <video autoplay muted loop playsinline preload="metadata" poster="poster.jpg">
      <source src="hero.mp4" type="video/mp4">
    </video>
    <div class="overlay" aria-hidden="true"></div>

    <main class="content">
      <div class="panel">
        <header>
          <div class="brand">
            <b>LED Vision</b>
            <span>LED施工・レンタル・販売</span>
          </div>
          <div class="mini" id="timestamp"></div>
        </header>

        <div class="row" style="margin-top:12px">
          <div class="check" aria-hidden="true">✓</div>
          <div>
            <h1>送信完了しました</h1>
            <p>
              お問い合わせありがとうございます。<br>
              内容を確認のうえ、担当者よりご連絡いたします。
            </p>
          </div>
        </div>

        <div class="row">
          <a class="btn btnPrimary" href="/">トップへ戻る</a>
          <span class="mini">※自動返信メールは設定により届かない場合があります</span>
        </div>
      </div>

      <div class="panel">
        <div class="mini" style="margin-bottom:8px">次にやること</div>
        <div class="mini">
          ・設置場所 / サイズ / 希望時期 / ご予算があるとスムーズです。<br>
          ・図面や写真がある場合は、返信メールに添付してください。
        </div>
      </div>
    </main>
  </section>

  <footer>
    <span>© <span id="year"></span> LED Vision</span>
    <span class="mini">Thanks</span>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    const d = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    document.getElementById("timestamp").textContent =
      `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  </script>
</body>

</html>
